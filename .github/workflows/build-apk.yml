name: Build ParallaxAGM APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/parallax.sh'
      - 'app/**'
      - 'version.json'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      VERSION_NAME: v2.0.2
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      # termux-am and the other upstream repos are vendored in this repository (downloaded from
      # Santoshkurmi/antigem standalone), so no submodule checkout is needed.

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Go 1.22
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make sure Android SDK 37 is installed
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager "platforms;android-37" "build-tools;37.0.0" || true
          fi

      - name: Verify duplicate chat ID regression
        run: ./gradlew :app:testDebugUnitTest --tests ai.antigem.ui.drawer.ChatHistoryDrawerTest

      # A fixed signing keystore is restored from the repository secret so every release has the same
      # certificate. AntiGemApplication.isOfficialRelease() checks its SHA-256 to mark this an official build.
      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "RELEASE_KEYSTORE_BASE64 secret is missing"; exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > app/release.jks
          keytool -list -v -keystore app/release.jks -storepass 123456 -alias antigem 2>/dev/null | grep SHA256:
          ls -l app/release.jks

      - name: Build signed release APK
        run: |
          chmod +x gradlew scripts/build_all_apks.sh
          ./scripts/build_all_apks.sh --release

      - name: Verify ParallaxAI CLI is bundled
        run: |
          APK=$(ls output/*.apk | head -1)
          echo "APK: $APK"
          unzip -l "$APK" | grep -q 'assets/bin/parallax' || { echo "parallax CLI missing from APK"; exit 1; }
          echo "ParallaxAI CLI present: assets/bin/parallax"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParallaxAGM-apk
          path: output/*.apk
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION_NAME }}
          name: ParallaxAGM ${{ env.VERSION_NAME }} (ParallaxAI)
          body: |
            AntiGem standalone with the ParallaxAI terminal client bundled.

            Open the app terminal and run:
            - `parallax tools`
            - `parallax chat "your question"`
            - `parallax batch "Q1" "Q2" "Q3"`
            - `parallax skill` (teaches in-app agents to use it)

            See `PARALLAXAI.md` in the repository for full usage.
          files: output/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
